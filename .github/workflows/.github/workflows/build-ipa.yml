name: Build IPA

on:
  workflow_dispatch: # roda só quando você toca em "Run workflow"

permissions:
  contents: write # necessário para publicar o .ipa em Releases

env:
  # Troque pelo identificador do seu app (letras minúsculas, sem espaços)
  BUNDLE_ID: com.cleiton.musicplayer
  APP_NAME: Music Player
  EXPO_NO_TELEMETRY: "1"
  CI: "1"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create Expo project
        run: npx create-expo-app@latest app-build --template blank-typescript --yes

      - name: Add project source
        run: |
          test -f project.zip || { echo "project.zip não encontrado na raiz do repositório"; exit 1; }
          unzip -o project.zip -d app-build

      - name: Install dependencies (versions matched to the SDK)
        working-directory: app-build
        run: |
          npx expo install expo-audio @react-native-community/slider @react-native-async-storage/async-storage @expo/vector-icons react-native-safe-area-context zustand

      - name: Configure app.json
        working-directory: app-build
        run: |
          node <<'EOF'
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          const e = cfg.expo;
          e.name = process.env.APP_NAME;
          e.slug = 'music-player';
          e.version = '1.0.0';
          e.orientation = 'portrait';
          e.userInterfaceStyle = 'dark';
          e.ios = {
            ...(e.ios || {}),
            supportsTablet: false,
            bundleIdentifier: process.env.BUNDLE_ID,
            infoPlist: { ...((e.ios && e.ios.infoPlist) || {}), UIBackgroundModes: ['audio'] },
          };
          e.plugins = Array.from(new Set([...(e.plugins || []), 'expo-audio']));
          fs.writeFileSync('app.json', JSON.stringify(cfg, null, 2));
          console.log(JSON.stringify(cfg, null, 2));
          EOF

      - name: Type check (informativo, não bloqueia o build)
        working-directory: app-build
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Generate native iOS project
        working-directory: app-build
        run: npx expo prebuild --platform ios

      - name: Build unsigned app
        working-directory: app-build/ios
        run: |
          WS=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WS%.xcworkspace}"
          echo "Workspace: $WS | Scheme: $SCHEME"
          xcodebuild \
            -workspace "$WS" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        working-directory: app-build/ios
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App: $APP"
          rm -rf Payload MusicPlayer.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry MusicPlayer.ipa Payload
          ls -lh MusicPlayer.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicPlayer-ipa
          path: app-build/ios/MusicPlayer.ipa

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" app-build/ios/MusicPlayer.ipa \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --notes "IPA sem assinatura. Assine e instale pelo Feather."
